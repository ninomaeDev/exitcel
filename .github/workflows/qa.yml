# テストケースを自動実行して、回帰したときだけ落とす。
#
# 既知の失敗(qa/known-failures.json)はビルドを落とさない。
# ここを「FAILが1件でもあれば赤」にすると、判断のうえで直さないと決めた
# BUG-010 のせいで常時赤になり、バッジが何も意味しなくなるため。
name: QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testcases:
    name: テストケース242件
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 外部ライブラリを使っていないので npm install は不要
      - name: テストを実行する
        run: node qa/run.js

      - name: 実行結果を成果物として残す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-results
          path: qa/results.json
